// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.wear_kotlin_version = '2.2.20'
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 8.13.x is what Capacitor 8 is built and tested against. Android Studio offers AGP 9;
        // it needs Capacitor 9 (a release candidate, not a release) and Gradle 9, and AGP 9's
        // built-in Kotlin collides with the standalone Kotlin plugins the wear module applies
        // below. Stay on 8.13 until the cap 9 migration
        // (capacitorjs.com/docs/next/updating/9-0). The Gradle wrapper does move inside the 8.14
        // line: 8.14.7 (November 2026) is the OSS patch for three advisories in the daemon
        // registry and the version-catalog accessors, and AGP 8.13 works with it unchanged.
        classpath 'com.android.tools.build:gradle:8.13.2'
        // Kotlin, Compose and kotlinx.serialization for the Wear OS module (wear/) only; app/ stays
        // Java and builds exactly as before.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$wear_kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$wear_kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$wear_kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
